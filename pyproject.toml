[project]
name = "tradebot"
version = "0.1.0"
description = "Felix's liquidity + candlestick trading bot: backtest first, then paper, then live on MetaTrader 5."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
tradebot = "tradebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
